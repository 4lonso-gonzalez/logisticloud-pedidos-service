name: CI/CD Pipeline - LogistiCloud Pedidos Service

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Quality Gate - Análisis Estático (Flake8)
        run: |
          flake8 app tests --max-line-length=120 --ignore=W292,W293,E302,E305

      - name: 5. Ejecutar Pruebas Automatizadas y Fitness Functions (Pytest)
        run: |
          pytest -v

      - name: 6. Construir Imagen Docker (Multi-Stage Build)
        run: |
          docker build -t logisticloud-pedidos:latest .

      - name: 7. Smoke Test sobre Contenedor Docker en Ejecución
        run: |
          docker run -d --name test-pedidos -p 8000:8000 logisticloud-pedidos:latest
          sleep 5
          curl -f http://localhost:8000/health
          docker stop test-pedidos